name: Offline review checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install locked environment (without flow/modal groups)
        run: uv sync --locked --group dev --no-group flow --no-group flow-gui --no-group modal
      - name: Ruff lint and format
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
      - name: Static type check (mypy)
        run: uv run --locked mypy src/deliverome_analysis
      - name: Offline tests
        run: uv run --locked pytest -q tests/ library/l1/orf-design/tests/
      - name: Manifest, pinned snapshots, and bundle audit
        run: |
          uv run --locked python library/l1/orf-design/pinned_refs.py
          uv run --locked python library/l1/orf-design/reviewer-package/bundle.py audit
      - name: Offline validation and cassette-diversity replay
        run: |
          uv run --locked python library/l1/orf-design/refold_check_clash_validation.py --report-only
          uv run --locked python library/l1/orf-design/diversify_arm_cassettes.py --check
      - name: Markdown relative-link and CITATION.cff check
        run: |
          uv run --locked python - <<'PY'
          import re, yaml
          from pathlib import Path

          root = Path(".")
          link_re = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          broken = []
          for md in sorted(root.rglob("*.md")):
              if any(p in {".git", ".venv", "historical", "review-repo"} for p in md.parts):
                  continue
              text = md.read_text(errors="ignore")
              for raw in link_re.findall(text):
                  target = raw.split("#", 1)[0].strip().strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if not (md.parent / target).exists():
                      broken.append(f"{md}: {target}")
          assert not broken, "Broken relative markdown links:\n  " + "\n  ".join(broken[:20])
          print("markdown relative links OK")

          cff = root / "CITATION.cff"
          if cff.is_file():
              data = yaml.safe_load(cff.read_text())
              for req in ("cff-version", "title", "authors"):
                  assert data and req in data, f"CITATION.cff missing {req!r}"
              print("CITATION.cff OK")
          PY
      - name: CLI smoke checks
        run: |
          uv run --locked python library/l1/orf-design/reviewer-package/run_review.py --help > /dev/null
          uv run --locked python library/l1/orf-design/reviewer-package/bundle.py --help > /dev/null
          uv run --locked python library/l1/orf-design/library_pipeline.py plan > /dev/null
          uv run --locked python library/l1/orf-design/l1_cterm_decisions.py --check
          uv run --locked python library/l1/orf-design/gate_isoform_cohort.py --help > /dev/null

  public-mirror-and-release-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --group dev --no-group flow --no-group flow-gui --no-group modal
      - name: Verify public R2 and source mirror objects online
        run: uv run --locked python library/l1/orf-design/reviewer-package/public_data.py check --workers 4
      - name: Verify GitHub release tag in README exists with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          readme = Path("README.md").read_text()
          m = re.search(r"/releases/tag/(bundle-[0-9a-zA-Z._-]+)", readme)
          assert m, "README.md must cite a pinned /releases/tag/bundle-... release"
          tag = m.group(1)
          out = subprocess.check_output(
              ["gh", "release", "view", tag, "--json", "tagName,assets"], text=True
          )
          rel = json.loads(out)
          assets = {a["name"]: a["size"] for a in rel.get("assets", [])}
          assert len(assets) >= 2 and all(s > 0 for s in assets.values()), (
              f"Release {tag} missing expected non-empty tarballs: {assets}"
          )
          print(f"Release {tag} verified: {assets}")
          PY

  docker-offline-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build digest-pinned offline replay image
        run: docker build -t deliverome-surfaceome-library-v1:frozen .
      - name: Verify zero-network container CLI and offline replay against release bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --network=none deliverome-surfaceome-library-v1:frozen --help > /dev/null
          TAG=$(python3 -c 'import re; from pathlib import Path; print(re.search(r"/releases/tag/(bundle-[0-9a-zA-Z._-]+)", Path("README.md").read_text()).group(1))')
          BUNDLE_DIR=$(mktemp -d)
          gh release download "$TAG" --pattern "l1-reviewer-bundle-*.tar.gz" --pattern "l1-pinned-releases-*.tar" --dir "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/unpacked"
          tar -xzf "$BUNDLE_DIR"/l1-reviewer-bundle-*.tar.gz -C "$BUNDLE_DIR/unpacked"
          tar -xf "$BUNDLE_DIR"/l1-pinned-releases-*.tar -C "$BUNDLE_DIR/unpacked"
          docker run --rm --network=none \
            -v "$BUNDLE_DIR/unpacked:/bundle:ro" \
            deliverome-surfaceome-library-v1:frozen --bundle /bundle
          rm -rf "$BUNDLE_DIR"
